; SPDX-License-Identifier: MIT
;
; LoRa sniffer -- Heltec WiFi LoRa 32 V4.
;
; Three things here are load-bearing and easy to get wrong:
;
;   board_build.partitions  must point at a table that includes the sniffer's slot.
;                           The shared table is triboot.csv, which is the layout the
;                           meshcore-meshtastic-heltec-v4 project also uses, with the
;                           sniffer as slot 2. snifferboot.csv is the same firmware on
;                           a board with nothing else on it.
;   SNIFFER_TX_CAPABLE      defaults to 0. 0 compiles OUT THE TRANSMIT CALL and
;                           nothing else: the radio, RadioLib and the whole receive
;                           path are in every build, because receiving is the product.
;                           See TxLockout.hpp before changing it.
;   SNIFFER_PROFILE_PSRAM   1 selects the psram memory profile, 0 the standard one.
;                           The boot check measures the board anyway; this only sets
;                           the table capacities.
;
; The host gate in ../Makefile is the gate. `make check` needs only a C++ compiler;
; this file needs PlatformIO and, for the radio path, RadioLib.

[platformio]
default_envs = heltec_v4_sniffer
src_dir = .

[env:heltec_v4_sniffer]
platform = espressif32@^6.9.0
; The V4 is an ESP32-S3 board with 16 MB of flash and octal PSRAM. PlatformIO has no
; board definition published for it, so this is the V3 definition -- the same
; ESP32-S3 family, and the closest published match -- with the flash size overridden
; below to match the partition tables.
;
; The SX1262 pins below (CS 7, IRQ 13, RST 12, BUSY 14) are the Heltec WiFi LoRa 32
; wiring and are UNVERIFIED against the V4 schematic. Check them before putting this on
; a roof; a wrong BUSY pin is an SX1262 that never finishes a transmission.
board = heltec_wifi_lora_32_V3
framework = arduino

board_build.partitions = partitions/triboot.csv
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

; RadioLib is not optional: the receive path is not compiled out, so every build needs
; it. The previous file had no lib_deps at all and could not have built.
lib_deps = jgromes/RadioLib@^7.1.2

; Transmit. 0 is the correct value for a device that will sit on a community
; frequency next to somebody's repeater; see firmware/include/sniffer/TxLockout.hpp.
build_flags =
    -I include
    -std=gnu++17
    -D SNIFFER_TX_CAPABLE=0
    -D SNIFFER_PROFILE_PSRAM=1
    -D SNIFFER_PARTITION_SLOTS=5
    -D SNIFFER_REGION=\"EU_868\"
    -D FREQUENCY_MHZ=0.0f
    -D CORE_DEBUG_LEVEL=3
build_unflags =
    -std=gnu++11

; The portable logic is compiled with the same strictness as the host gate, so a
; warning that would fail CI cannot sit unnoticed in the firmware build.
; -Wconversion in particular catches the narrowing bugs that a radio struct
; invites -- and catches them in the *firmware* build, where the host gate cannot see.
build_type = release

[env:heltec_v4_sniffer_standalone]
extends = env:heltec_v4_sniffer
; Just this firmware, for a board with no mesh stack on it. Slot 0 holds the
; sniffer, so it boots as a logger rather than as a node -- which is the right
; default for a board being used to survey a frequency.
board_build.partitions = partitions/snifferboot.csv
build_flags =
    -I include
    -std=gnu++17
    -D SNIFFER_TX_CAPABLE=0
    -D SNIFFER_PROFILE_PSRAM=1
    -D SNIFFER_PARTITION_SLOTS=1
    -D SNIFFER_REGION=\"EU_868\"
    -D FREQUENCY_MHZ=0.0f
    -D CORE_DEBUG_LEVEL=3

; The beacon build. Separate on purpose: it is a different image with a different
; guarantee, and an operator who wants a device that can transmit has to flash
; something that says so on every boot.
[env:heltec_v4_sniffer_beacon]
extends = env:heltec_v4_sniffer
build_flags =
    -I include
    -std=gnu++17
    -D SNIFFER_TX_CAPABLE=1
    -D SNIFFER_PROFILE_PSRAM=1
    -D SNIFFER_PARTITION_SLOTS=5
    -D SNIFFER_REGION=\"EU_868\"
    -D FREQUENCY_MHZ=0.0f
    -D CORE_DEBUG_LEVEL=3

; Beacon build against the standalone table. This exists so CI compiles the transmit
; path on a platform that can build it: the shared table's `littlefs` subtype is
; rejected by the partition generator in the pinned arduino-esp32 2.x (see docs/SLOTS.md),
; so the shared beacon env cannot be built there and an unbuilt transmit path is exactly
; the kind of code that ships broken.
[env:heltec_v4_sniffer_beacon_standalone]
extends = env:heltec_v4_sniffer
board_build.partitions = partitions/snifferboot.csv
build_flags =
    -I include
    -std=gnu++17
    -D SNIFFER_TX_CAPABLE=1
    -D SNIFFER_PROFILE_PSRAM=1
    -D SNIFFER_PARTITION_SLOTS=1
    -D SNIFFER_REGION=\"EU_868\"
    -D FREQUENCY_MHZ=0.0f
    -D CORE_DEBUG_LEVEL=3
